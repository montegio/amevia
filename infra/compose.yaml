name: amevia

services:
  php:
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: amevia-php
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ../backend:/var/www/html
    environment:
      APP_ENV: local
    networks:
      - amevia-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:stable-alpine
    container_name: amevia-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ../backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - amevia-network
    depends_on:
      - php

  postgres:
    image: postgres:17-alpine
    container_name: amevia-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-amevia}
      POSTGRES_USER: ${POSTGRES_USER:-amevia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-5XUOkYvinQKC8Nd2mYh5}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-amevia} -d ${POSTGRES_DB:-amevia}
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - amevia-network

  redis:
    image: redis:8-alpine
    container_name: amevia-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - amevia-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: amevia-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_WEB_PORT:-8025}:8025"
    networks:
      - amevia-network

networks:
  amevia-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
